<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Boxscore</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; color: #111; }
    h1, h2 { margin-bottom: 10px; }
    .top-nav { margin-bottom: 20px; }
    .top-nav a { margin-right: 15px; text-decoration: none; color: #0055aa; font-weight: bold; }
    .top-nav a:hover { text-decoration: underline; }
    .teams {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }
    .teams img { width: 48px; height: 48px; }
    .score-line { font-size: 1.4em; font-weight: bold; margin-bottom: 6px; }
    .state { color: #888; font-size: 0.85em; margin-left: 10px; font-weight: normal; }
    .section { margin-top: 28px; }
    .section h2 { font-size: 1em; text-transform: uppercase; color: #003087; border-bottom: 2px solid #003087; padding-bottom: 4px; margin-bottom: 10px; }
    pre {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 14px;
      font-size: 13px;
      font-family: "Courier New", Courier, monospace;
      overflow-x: auto;
      line-height: 1.6;
    }
    .batting-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .pitching-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 700px) {
      .batting-grid, .pitching-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="/mlb-boxscores/">Home</a>
  <a href="/mlb-boxscores/leaders.html">Leaders</a>
</nav>

<div class="teams" id="teams"></div>
<div class="score-line" id="score-line"></div>
<h1 id="title">Loading...</h1>

<div class="section">
  <h2>Line Score</h2>
  <div id="linescore"></div>
</div>

<div class="section">
  <h2>Batting</h2>
  <div class="batting-grid">
    <div id="away-batting"></div>
    <div id="home-batting"></div>
  </div>
</div>

<div class="section">
  <h2>Pitching</h2>
  <div class="pitching-grid">
    <div id="away-pitching"></div>
    <div id="home-pitching"></div>
  </div>
</div>

<script>
var gamePk = new URLSearchParams(window.location.search).get("gamePk");

if (!gamePk) {
  document.getElementById("title").textContent = "No game specified.";
}

async function loadGame() {
  var titleEl = document.getElementById("title");

  var indexRes;
  try {
    indexRes = await fetch("/mlb-boxscores/data/index.json");
    if (!indexRes.ok) throw new Error("index.json failed: " + indexRes.status);
  } catch (err) {
    titleEl.textContent = "Error loading index: " + err.message;
    return;
  }

  var dates = await indexRes.json();
  dates = dates.slice().reverse();

  var foundGame = null;

  for (var i = 0; i < dates.length; i++) {
    var date = dates[i];
    try {
      var res = await fetch("/mlb-boxscores/data/boxscores-" + date + ".json");
      if (!res.ok) continue;
      var games = await res.json();
      for (var j = 0; j < games.length; j++) {
        if (String(games[j].gamePk) === String(gamePk)) {
          foundGame = games[j];
          break;
        }
      }
      if (foundGame) break;
    } catch (err) {
      continue;
    }
  }

  if (!foundGame) {
    titleEl.textContent = "Game not found.";
    return;
  }

  renderGame(foundGame);
}

function renderGame(game) {
  document.getElementById("title").textContent = game.away + " @ " + game.home;

  var awayScore = game.awayScore !== undefined ? game.awayScore : "?";
  var homeScore = game.homeScore !== undefined ? game.homeScore : "?";
  var state = game.state || "";

  document.getElementById("score-line").innerHTML =
    game.away + " " + awayScore + ", " + game.home + " " + homeScore +
    '<span class="state">' + state + "</span>";

  var awayId = game.awayId || "";
  var homeId = game.homeId || "";

  document.getElementById("teams").innerHTML =
    (awayId ? '<img src="https://www.mlbstatic.com/team-logos/' + awayId + '.svg" onerror="this.style.display=\'none\'">' : "") +
    "<strong>" + game.away + "</strong>" +
    " @ " +
    "<strong>" + game.home + "</strong>" +
    (homeId ? '<img src="https://www.mlbstatic.com/team-logos/' + homeId + '.svg" onerror="this.style.display=\'none\'">' : "");

  document.getElementById("linescore").innerHTML =
    "<pre>" + (game.lineText || game.text || "No line score available.") + "</pre>";

  document.getElementById("away-batting").innerHTML =
    game.awayBatting ? "<pre>" + game.awayBatting + "</pre>" : "<p>No batting data.</p>";

  document.getElementById("home-batting").innerHTML =
    game.homeBatting ? "<pre>" + game.homeBatting + "</pre>" : "<p>No batting data.</p>";

  document.getElementById("away-pitching").innerHTML =
    game.awayPitching ? "<pre>" + game.awayPitching + "</pre>" : "<p>No pitching data.</p>";

  document.getElementById("home-pitching").innerHTML =
    game.homePitching ? "<pre>" + game.homePitching + "</pre>" : "<p>No pitching data.</p>";
}

loadGame();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Boxscore</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; color: #111; }
    .top-nav { margin-bottom: 20px; }
    .top-nav a { margin-right: 15px; text-decoration: none; color: #0055aa; font-weight: bold; font-size: 0.9em; }
    .top-nav a:hover { text-decoration: underline; }

    .game-header {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .game-header .matchup {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .game-header .matchup img { width: 52px; height: 52px; }
    .game-header .matchup .team-name { font-size: 1.1em; font-weight: bold; }
    .game-header .score { font-size: 2em; font-weight: bold; color: #003087; }
    .game-header .score .sep { color: #aaa; margin: 0 8px; font-weight: normal; }
    .game-header .state { font-size: 0.85em; color: #888; margin-top: 4px; }

    .section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .section-title {
      font-size: 0.75em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #003087;
      border-bottom: 2px solid #003087;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
    thead th {
      text-align: right;
      color: #888;
      font-weight: normal;
      font-size: 0.8em;
      padding: 4px 8px;
      border-bottom: 1px solid #eee;
    }
    thead th.left { text-align: left; }
    tbody td {
      padding: 5px 8px;
      text-align: right;
      border-bottom: 1px solid #f0f0f0;
    }
    tbody td.left { text-align: left; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.total-row td { font-weight: bold; border-top: 1px solid #ddd; background: #fafafa; }
    tbody tr:hover td { background: #f9f9f9; }
    tbody tr.total-row:hover td { background: #fafafa; }

    .linescore-table thead th { text-align: center; }
    .linescore-table tbody td { text-align: center; }
    .linescore-table tbody td.left { text-align: left; font-weight: bold; min-width: 140px; }
    .linescore-table tbody td.rhe { font-weight: bold; border-left: 1px solid #eee; }
    .linescore-table thead th.rhe { border-left: 1px solid #eee; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }

    .team-label {
      font-size: 0.8em;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .notes-section { margin-bottom: 16px; }
    .notes-section-title {
      font-size: 0.8em;
      font-weight: bold;
      color: #003087;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #eee;
    }
    .note-row { font-size: 0.85em; line-height: 1.7; margin-bottom: 2px; }
    .note-label { font-weight: bold; }
    .pitcher-note { color: #003087; font-weight: bold; font-size: 0.85em; margin-left: 4px; }
    .winner { font-weight: bold; }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="/mlb-boxscores/">Home</a>
  <a href="/mlb-boxscores/leaders.html">Leaders</a>
</nav>

<div id="content">Loading...</div>

<script>
var gamePk = new URLSearchParams(window.location.search).get("gamePk");

async function loadGame() {
  var content = document.getElementById("content");

  var indexRes;
  try {
    indexRes = await fetch("/mlb-boxscores/data/index.json");
    if (!indexRes.ok) throw new Error("index.json failed: " + indexRes.status);
  } catch (err) {
    content.innerHTML = "Error loading index: " + err.message;
    return;
  }

  var dates = await indexRes.json();
  dates = dates.slice().reverse();

  var game = null;
  for (var i = 0; i < dates.length; i++) {
    try {
      var res = await fetch("/mlb-boxscores/data/boxscores-" + dates[i] + ".json");
      if (!res.ok) continue;
      var games = await res.json();
      for (var j = 0; j < games.length; j++) {
        if (String(games[j].gamePk) === String(gamePk)) {
          game = games[j];
          break;
        }
      }
      if (game) break;
    } catch (err) { continue; }
  }

  if (!game) {
    content.innerHTML = "<h2>Game not found.</h2>";
    return;
  }

  renderGame(game);
}

function renderGame(g) {
  var awayScore = g.awayScore !== undefined ? g.awayScore : "?";
  var homeScore = g.homeScore !== undefined ? g.homeScore : "?";
  var awayWon = awayScore > homeScore;
  var homeWon = homeScore > awayScore;
  var awayId = g.awayId || "";
  var homeId = g.homeId || "";

  var html = "";

  // Header
  html += '<div class="game-header">';
  html += '<div class="matchup">';
  if (awayId) html += '<img src="https://www.mlbstatic.com/team-logos/' + awayId + '.svg" onerror="this.style.display=\'none\'">';
  html += '<span class="team-name' + (awayWon ? " winner" : "") + '">' + g.away + "</span>";
  html += '<div class="score">';
  html += '<span class="' + (awayWon ? "winner" : "") + '">' + awayScore + "</span>";
  html += '<span class="sep">—</span>';
  html += '<span class="' + (homeWon ? "winner" : "") + '">' + homeScore + "</span>";
  html += "</div>";
  html += '<span class="team-name' + (homeWon ? " winner" : "") + '">' + g.home + "</span>";
  if (homeId) html += '<img src="https://www.mlbstatic.com/team-logos/' + homeId + '.svg" onerror="this.style.display=\'none\'">';
  html += "</div>";
  html += '<div class="state">' + (g.state || "Final") + "</div>";
  html += "</div>";

  // Linescore
  html += '<div class="section">';
  html += '<div class="section-title">Line Score</div>';
  html += buildLinescoreTable(g.linescoreData);
  html += "</div>";

  // Batting
  html += '<div class="section">';
  html += '<div class="section-title">Batting</div>';
  html += '<div class="two-col">';
  html += '<div><div class="team-label">' + g.away + "</div>" + buildBattingTable(g.awayBatters) + "</div>";
  html += '<div><div class="team-label">' + g.home + "</div>" + buildBattingTable(g.homeBatters) + "</div>";
  html += "</div></div>";

  // Pitching
  html += '<div class="section">';
  html += '<div class="section-title">Pitching</div>';
  html += '<div class="two-col">';
  html += '<div><div class="team-label">' + g.away + "</div>" + buildPitchingTable(g.awayPitchers) + "</div>";
  html += '<div><div class="team-label">' + g.home + "</div>" + buildPitchingTable(g.homePitchers) + "</div>";
  html += "</div></div>";

  // Notes
  if (g.notes && g.notes.length) {
    html += '<div class="section">';
    html += '<div class="section-title">Game Notes</div>';
    for (var i = 0; i < g.notes.length; i++) {
      var section = g.notes[i];
      html += '<div class="notes-section">';
      html += '<div class="notes-section-title">' + section.title + "</div>";
      for (var j = 0; j < section.fields.length; j++) {
        var f = section.fields[j];
        html += '<div class="note-row"><span class="note-label">' + f.label + ":</span> " + f.value + "</div>";
      }
      html += "</div>";
    }
    html += "</div>";
  }

  document.getElementById("content").innerHTML = html;
}

function buildLinescoreTable(ld) {
  if (!ld) return "<p>No line score available.</p>";

  var numInnings = ld.innings || 9;

  var html = '<table class="linescore-table"><thead><tr>';
  html += '<th class="left">Team</th>';
  for (var i = 1; i <= numInnings; i++) {
    html += "<th>" + i + "</th>";
  }
  html += '<th class="rhe">R</th>';
  html += '<th class="rhe">H</th>';
  html += '<th class="rhe">E</th>';
  html += "</tr></thead><tbody>";

  function buildRow(team) {
    var row = '<tr><td class="left">' + team.name + "</td>";
    for (var i = 0; i < numInnings; i++) {
      var val = team.innings[i] !== undefined ? team.innings[i] : "-";
      row += "<td>" + val + "</td>";
    }
    row += '<td class="rhe">' + team.r + "</td>";
    row += '<td class="rhe">' + team.h + "</td>";
    row += '<td class="rhe">' + team.e + "</td>";
    row += "</tr>";
    return row;
  }

  html += buildRow(ld.away);
  html += buildRow(ld.home);
  html += "</tbody></table>";
  return html;
}

function buildBattingTable(batters) {
  if (!batters || !batters.length) return '<p style="color:#aaa;font-size:0.85em;">No data.</p>';
  var html = "<table><thead><tr>";
  html += '<th class="left">Player</th>';
  html += "<th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>AVG</th>";
  html += "</tr></thead><tbody>";
  for (var i = 0; i < batters.length; i++) {
    var b = batters[i];
    var rowClass = b.isTotal ? ' class="total-row"' : "";
    var nameStr = b.isTotal ? "TOTALS" : b.name + (b.pos ? ' <span style="color:#aaa;font-size:0.85em;">' + b.pos + "</span>" : "");
    html += "<tr" + rowClass + ">";
    html += '<td class="left">' + nameStr + "</td>";
    html += "<td>" + b.ab + "</td>";
    html += "<td>" + b.r + "</td>";
    html += "<td>" + b.h + "</td>";
    html += "<td>" + b.rbi + "</td>";
    html += "<td>" + b.bb + "</td>";
    html += "<td>" + b.so + "</td>";
    html += "<td>" + (b.avg || "") + "</td>";
    html += "</tr>";
  }
  html += "</tbody></table>";
  return html;
}

function buildPitchingTable(pitchers) {
  if (!pitchers || !pitchers.length) return '<p style="color:#aaa;font-size:0.85em;">No data.</p>';
  var html = "<table><thead><tr>";
  html += '<th class="left">Pitcher</th>';
  html += "<th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>SO</th><th>ERA</th>";
  html += "</tr></thead><tbody>";
  for (var i = 0; i < pitchers.length; i++) {
    var p = pitchers[i];
    var nameStr = p.name + (p.note ? '<span class="pitcher-note">(' + p.note + ")</span>" : "");
    html += "<tr>";
    html += '<td class="left">' + nameStr + "</td>";
    html += "<td>" + p.ip + "</td>";
    html += "<td>" + p.h + "</td>";
    html += "<td>" + p.r + "</td>";
    html += "<td>" + p.er + "</td>";
    html += "<td>" + p.bb + "</td>";
    html += "<td>" + p.so + "</td>";
    html += "<td>" + (p.era || "") + "</td>";
    html += "</tr>";
  }
  html += "</tbody></table>";
  return html;
}

loadGame();
</script>
</body>
</html>

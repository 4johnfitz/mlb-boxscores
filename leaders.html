<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB League Leaders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    h2 {
      margin-top: 10px;
    }

    details {
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      background: #fafafa;
    }

    summary {
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    h3 {
      margin-top: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      background: #f3f3f3;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }

    .team-logo {
      width: 20px;
      height: 20px;
      margin-left: 5px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<h1>League Leaders</h1>

<div class="grid">
  <div id="al"></div>
  <div id="nl"></div>
</div>

<script>

const hittingStats = [
  { label: "Home Runs", stat: "homeRuns" },
  { label: "RBI", stat: "rbi" },
  { label: "Batting Avg", stat: "avg" }
];

const pitchingStats = [
  { label: "Wins", stat: "wins" },
  { label: "ERA", stat: "era" },
  { label: "Strikeouts", stat: "strikeOuts" }
];

function teamLogo(id) {
  return `https://www.mlbstatic.com/team-logos/${id}.svg`;
}

async function loadGroup(title, leagueId, stats) {

  let html = `<h2>${title}</h2>`;

  // COLLAPSIBLE HITTING / PITCHING WRAPPER
  html += `<details open><summary>Hitting</summary>`;

  for (const s of stats.hitting) {
    html += await buildTable(s, leagueId);
  }

  html += `</details>`;

  html += `<details><summary>Pitching</summary>`;

  for (const s of stats.pitching) {
    html += await buildTable(s, leagueId);
  }

  html += `</details>`;

  return html;
}

async function buildTable(s, leagueId) {

  const url =
    `https://statsapi.mlb.com/api/v1/stats/leaders` +
    `?leaderCategories=${s.stat}` +
    `&leagueId=${leagueId}` +
    `&limit=5`;

  const res = await fetch(url);
  const data = await res.json();

  const leaders = data.leagueLeaders?.[0]?.leaders || [];

  let html = `<h3>${s.label}</h3>`;

  html += `
    <table>
      <tr>
        <th>Player</th>
        <th>Team</th>
        <th>Value</th>
      </tr>
  `;

  leaders.forEach(p => {
    const id = p.person?.id;
    const teamId = p.team?.id;

    html += `
      <tr>
        <td>
          <div class="player">
            <img src="https://img.mlbstatic.com/mlb-photos/image/upload/w_100,q_auto:best/v1/people/${id}/headshot/67/current">
            ${p.person?.fullName || "Unknown"}
          </div>
        </td>

        <td>
          ${p.team?.name || "-"}
          ${teamId ? `<img class="team-logo" src="${teamLogo(teamId)}">` : ""}
        </td>

        <td>${p.value ?? "-"}</td>
      </tr>
    `;
  });

  html += `</table>`;

  return html;
}

async function loadLeague(leagueId, elementId, title) {
  const stats = {
    hitting: hittingStats,
    pitching: pitchingStats
  };

  const html = await loadGroup(title, leagueId, stats);
  document.getElementById(elementId).innerHTML = html;
}

// INIT
loadLeague(103, "al", "American League");
loadLeague(104, "nl", "National League");

</script>

</body>
</html>

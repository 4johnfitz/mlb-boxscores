name: Generate MLB Boxscores

on:
  schedule:
    - cron: "0 12 * * *"   # runs daily at 12:00 UTC (5am PT)
  workflow_dispatch:        # allows manual run

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run boxscore generator
        run: node fetchBoxscores.js

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/
          git commit -m "Update boxscores" || echo "No changes to commit"
          git push

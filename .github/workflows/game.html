<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Boxscore</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1, h2 {
      margin-bottom: 10px;
    }

    .teams {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .teams img {
      width: 40px;
      height: 40px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 25px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #f2f2f2;
    }

    .section {
      margin-top: 25px;
    }
  </style>
</head>

<body>

<h1 id="title">Loading...</h1>

<div class="teams" id="teams"></div>

<div class="section">
  <h2>Line Score</h2>
  <div id="linescore"></div>
</div>

<div class="section">
  <h2>Batting</h2>
  <div id="batting"></div>
</div>

<div class="section">
  <h2>Pitching</h2>
  <div id="pitching"></div>
</div>

<script>

const gamePk = new URLSearchParams(window.location.search).get("gamePk");

// -------------------------
// LOAD GAME FROM ALL DATES
// -------------------------
async function loadGame() {

  const indexRes = await fetch("/mlb-boxscores/data/index.json");
  const dates = await indexRes.json();

  let foundGame = null;

  for (const date of dates.reverse()) {

    const res = await fetch(`/mlb-boxscores/data/boxscores-${date}.json`);
    const games = await res.json();

    const game = games.find(g => String(g.gamePk) === String(gamePk));

    if (game) {
      foundGame = game;
      break;
    }
  }

  if (!foundGame) {
    document.body.innerHTML = "<h2>Game not found</h2>";
    return;
  }

  renderGame(foundGame);
}

// -------------------------
// RENDER GAME
// -------------------------
function renderGame(game) {

  document.getElementById("title").textContent =
    `${game.away} @ ${game.home}`;

  // logos (you can improve mapping later)
  document.getElementById("teams").innerHTML = `
    <img src="https://www.mlbstatic.com/team-logos/${game.awayId || ""}.svg">
    <strong>${game.away}</strong>
    @
    <strong>${game.home}</strong>
    <img src="https://www.mlbstatic.com/team-logos/${game.homeId || ""}.svg">
  `;

  // split your text block
  const parts = game.text.split("\n\n");

  // line score
  document.getElementById("linescore").innerHTML =
    `<pre>${parts[1] || ""}</pre>`;

  // batting
  document.getElementById("batting").innerHTML =
    `<pre>${parts[2] || ""}\n\n${parts[3] || ""}</pre>`;

  // pitching
  document.getElementById("pitching").innerHTML =
    `<pre>${parts[4] || ""}\n\n${parts[5] || ""}</pre>`;
}

// INIT
loadGame();

</script>

</body>
</html>

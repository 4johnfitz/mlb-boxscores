<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .top-nav {
      margin-bottom: 20px;
    }

    .top-nav a {
      margin-right: 15px;
      text-decoration: none;
      color: blue;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f2f2f2;
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-top: 15px;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-cell img {
      width: 18px;
      height: 18px;
    }
  </style>
</head>

<body>

<h1>MLB Boxscore Archive</h1>

<div class="top-nav">
  <a href="index.html">Home</a>
  <a href="leaders.html">League Leaders</a>
</div>

<!-- ARCHIVE -->
<div>
  <h2>Games Archive</h2>
  <div id="list">Loading...</div>
</div>

<!-- GRID -->
<div class="grid">

  <!-- STANDINGS -->
  <div>
    <h2>Standings</h2>
    <div id="standings">Loading standings...</div>
  </div>

</div>

<script>

fetch("/mlb-boxscores/data/index.json")
  .then(r => r.json())
  .then(dates => {
    dates.sort().reverse();

    document.getElementById("list").innerHTML =
      dates.map(d =>
        `<p><a href="day.html?date=${d}">${d}</a></p>`
      ).join("");
  });

async function loadStandings() {
  try {
    const res = await fetch(
      "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
    );

    const data = await res.json();
    const records = data.records || [];

    const indexRes = await fetch("/mlb-boxscores/data/index.json");
    const dates = await indexRes.json();
    const latestDate = dates.sort().reverse()[0];

    const divisionMap = {
      "American League East": "AL East",
      "American League Central": "AL Central",
      "American League West": "AL West",
      "National League East": "NL East",
      "National League Central": "NL Central",
      "National League West": "NL West"
    };

    let html = "";

    records.forEach(group => {

      const rawName =
        group.division?.name ||
        group.division?.nameShort ||
        group.league?.name ||
        "MLB";

      const divisionName = divisionMap[rawName] || rawName;

      html += `<h3>${divisionName}</h3>`;

      html += `
        <table>
          <tr>
            <th>Team</th>
            <th>W</th>
            <th>L</th>
            <th>GB</th>
            <th>Streak</th>
            <th>Last Game</th>
          </tr>
      `;

      group.teamRecords.forEach(team => {

        const teamId = team.team.id;

        const logo = `https://www.mlbstatic.com/team-logos/${teamId}.svg`;

        const streak = team.streak?.streakCode || "-";

        const lastGameLink = latestDate
          ? `<a href="day.html?date=${latestDate}">View</a>`
          : "-";

        html += `
          <tr>
            <td>
              <div class="team-cell">
                <img src="${logo}" alt="">
                ${team.team.name}
              </div>
            </td>
            <td>${team.wins}</td>
            <td>${team.losses}</td>
            <td>${team.gamesBack || "-"}</td>
            <td>${streak}</td>
            <td>${lastGameLink}</td>
          </tr>
        `;
      });

      html += `</table>`;
    });

    document.getElementById("standings").innerHTML = html;

  } catch (err) {
    console.error("Standings error:", err);
    document.getElementById("standings").innerHTML =
      "Failed to load standings.";
  }
}

loadStandings();

</script>

</body>
</html>

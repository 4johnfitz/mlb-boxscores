<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB League Leaders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    h2 {
      margin-top: 10px;
    }

    h3 {
      margin-top: 25px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 14px;
    }

    th {
      background: #f3f3f3;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }
  </style>
</head>

<body>

<h1>League Leaders</h1>

<div class="grid">
  <div id="al"></div>
  <div id="nl"></div>
</div>

<script>

const stats = [
  { label: "Home Runs", stat: "homeRuns" },
  { label: "RBI", stat: "rbi" },
  { label: "Batting Avg", stat: "avg" },
  { label: "Wins", stat: "wins" },
  { label: "ERA", stat: "era" },
  { label: "Strikeouts", stat: "strikeOuts" }
];

async function loadLeague(leagueId, elementId, title) {

  let html = `<h2>${title}</h2>`;

  for (const s of stats) {

    const url =
      `https://statsapi.mlb.com/api/v1/stats/leaders` +
      `?leaderCategories=${s.stat}` +
      `&leagueId=${leagueId}` +
      `&limit=5`;

    const res = await fetch(url);
    const data = await res.json();

    const leaders = data.leagueLeaders?.[0]?.leaders || [];

    html += `<h3>${s.label}</h3>`;

    html += `
      <table>
        <tr>
          <th>Player</th>
          <th>Value</th>
        </tr>
    `;

    leaders.forEach(p => {
      const id = p.person?.id;

      html += `
        <tr>
          <td>
            <div class="player">
              <img src="https://img.mlbstatic.com/mlb-photos/image/upload/w_100,q_auto:best/v1/people/${id}/headshot/67/current">
              ${p.person?.fullName || "Unknown"}
            </div>
          </td>
          <td>${p.value ?? "-"}</td>
        </tr>
      `;
    });

    html += `</table>`;
  }

  document.getElementById(elementId).innerHTML = html;
}

// INIT
loadLeague(103, "al", "American League");
loadLeague(104, "nl", "National League");

</script>

</body>
</html>

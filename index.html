<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscores</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: #f9f9f9; color: #111; }
    h1, h2 { margin-bottom: 10px; }

    /* Jump nav */
    .jump-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 10px;
    }
    .jump-nav a {
      text-decoration: none;
      color: #003087;
      font-weight: bold;
      font-size: 0.9em;
      padding: 6px 14px;
      border-radius: 20px;
      background: white;
      border: 1px solid #ddd;
    }
    .jump-nav a:hover { background: #003087; color: white; }

    .date { color: #666; margin-left: 10px; font-size: 0.85em; font-weight: normal; }

   /* Games table */
.games-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9em;
  margin-bottom: 10px;
}
.games-table tbody td {
  padding: 4px 12px 4px 0;
  border: none;
}
.games-table tbody td.num {
  text-align: right;
  padding-right: 24px;
  font-variant-numeric: tabular-nums;
  min-width: 28px;
}
.games-table tbody tr:hover td { background: none; }
.games-table a { text-decoration: none; color: #003087; }
.games-table a:hover { text-decoration: underline; }
.winner { font-weight: bold; }
.final-badge { font-size: 0.75em; color: #aaa; padding-left: 8px; }
.team-logo-sm { width: 18px; height: 18px; vertical-align: middle; margin-right: 5px; }

    /* Collapsible sections */
    .collapsible-section { margin-bottom: 20px; }
    .collapsible-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 10px 14px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      user-select: none;
    }
    .collapsible-header:hover { background: #f5f8ff; }
    .collapsible-header h2 { margin: 0; font-size: 1em; color: #003087; }
    .collapsible-arrow { color: #003087; font-size: 1em; transition: transform 0.2s; }
    .collapsible-arrow.open { transform: rotate(180deg); }
    .collapsible-body { display: none; padding-top: 14px; }
    .collapsible-body.open { display: block; }

    /* Sub-collapsible (AL/NL) */
    .sub-collapsible { margin-bottom: 12px; }
    .sub-collapsible-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 7px 12px;
      background: #f0f4ff;
      border: 1px solid #ccd6f0;
      border-radius: 6px;
      user-select: none;
      margin-bottom: 0;
    }
    .sub-collapsible-header:hover { background: #e0e8ff; }
    .sub-collapsible-header span { font-weight: bold; font-size: 0.9em; color: #003087; text-transform: uppercase; letter-spacing: 0.05em; }
    .sub-collapsible-arrow { color: #003087; font-size: 0.85em; transition: transform 0.2s; }
    .sub-collapsible-arrow.open { transform: rotate(180deg); }
    .sub-collapsible-body { display: none; padding-top: 10px; }
    .sub-collapsible-body.open { display: block; }

    /* Standings */
    .standings-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 700px) { .standings-grid { grid-template-columns: 1fr; } }
    .division-block {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
    }
    .division-block h3 {
      margin: 0 0 8px 0;
      font-size: 0.95em;
      color: #003087;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    .standings-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
    .standings-table th { text-align: left; color: #888; font-weight: normal; padding: 2px 4px; }
    .standings-table th.num, .standings-table td.num { text-align: right; }
    .standings-table td { padding: 3px 4px; }
    .standings-table tr:nth-child(even) td { background: #f5f5f5; }
    .team-logo { width: 18px; height: 18px; vertical-align: middle; margin-right: 5px; }
    .team-link { color: #003087; text-decoration: none; border-bottom: 1px dotted #003087; cursor: pointer; font-size: 0.85em; }
    .team-link:hover { color: #0055aa; }

    /* Leaders */
    .leaders-group-title {
      font-size: 0.8em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin: 14px 0 6px;
    }
    .leaders-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 700px) { .leaders-grid { grid-template-columns: 1fr; } }
    .leader-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .leader-card-title {
      font-size: 0.75em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #003087;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
      margin-bottom: 8px;
    }
    .leader-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.83em;
    }
    .leader-row img.headshot {
      width: 28px; height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #eee;
      flex-shrink: 0;
    }
    .leader-row img.tlogo { width: 16px; height: 16px; vertical-align: middle; flex-shrink: 0; }
    .leader-name { flex: 1; color: #111; }
    .leader-value { font-weight: bold; color: #003087; min-width: 36px; text-align: right; }
    .leader-rank { color: #aaa; font-size: 0.85em; min-width: 16px; }

    /* Team Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 10px;
      width: 420px;
      max-width: 95vw;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #eee;
      position: relative;
    }
    .modal-header img.team-logo-lg { width: 52px; height: 52px; }
    .modal-header .modal-team-name { font-size: 1.1em; font-weight: bold; color: #003087; }
    .modal-header .modal-team-record { font-size: 0.85em; color: #888; margin-top: 2px; }
    .modal-close {
      position: absolute; top: 12px; right: 14px;
      font-size: 1.4em; color: #aaa; cursor: pointer;
      background: none; border: none; padding: 0;
    }
    .modal-close:hover { color: #333; }
    .modal-body { padding: 14px 20px 20px; font-size: 0.85em; }
    .modal-stat-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .modal-stat-row:last-child { border-bottom: none; }
    .modal-stat-label { color: #555; }
    .modal-stat-value { font-weight: bold; color: #003087; }
    .modal-section-title {
      font-size: 0.75em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #003087;
      margin: 14px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #eee;
    }
    .modal-loading { color: #aaa; text-align: center; padding: 20px 0; }

    section { margin-bottom: 28px; }
  </style>
</head>
<body>

<div class="jump-nav">
  <a href="#games">Yesterday's Games</a>
  <a href="#standings">Standings</a>
  <a href="#leaders">Leaders</a>
</div>

<!-- YESTERDAY'S GAMES -->
<section id="games">
  <h1>Yesterday's Games <span id="dateLabel" class="date"></span></h1>
  <div id="games-container">Loading...</div>
</section>

<!-- STANDINGS -->
<section id="standings">
  <div class="collapsible-section">
    <div class="collapsible-header" onclick="toggleSection('standings-body', 'standings-arrow')">
      <h2>Standings</h2>
      <span class="collapsible-arrow open" id="standings-arrow">&#9660;</span>
    </div>
    <div class="collapsible-body open" id="standings-body">
      <div id="standings-container">Loading standings...</div>
    </div>
  </div>
</section>

<!-- LEADERS -->
<section id="leaders">
  <div class="collapsible-section">
    <div class="collapsible-header" onclick="toggleSection('leaders-body', 'leaders-arrow')">
      <h2>League Leaders</h2>
      <span class="collapsible-arrow open" id="leaders-arrow">&#9660;</span>
    </div>
    <div class="collapsible-body open" id="leaders-body">
      <div id="leaders-container">Loading leaders...</div>
    </div>
  </div>
</section>

<!-- Team Modal -->
<div class="modal-overlay" id="teamModal">
  <div class="modal">
    <div class="modal-header">
      <img class="team-logo-lg" id="modalTeamLogo" src="" alt="" onerror="this.style.display='none'">
      <div>
        <div class="modal-team-name" id="modalTeamName"></div>
        <div class="modal-team-record" id="modalTeamRecord"></div>
      </div>
      <button class="modal-close" onclick="closeTeamModal()">x</button>
    </div>
    <div class="modal-body" id="modalTeamBody">
      <div class="modal-loading">Loading...</div>
    </div>
  </div>
</div>

<script>
// -------------------------
// COLLAPSIBLE
// -------------------------
function toggleSection(bodyId, arrowId) {
  var body = document.getElementById(bodyId);
  var arrow = document.getElementById(arrowId);
  body.classList.toggle("open");
  arrow.classList.toggle("open");
}

function toggleSub(bodyId, arrowId) {
  var body = document.getElementById(bodyId);
  var arrow = document.getElementById(arrowId);
  body.classList.toggle("open");
  arrow.classList.toggle("open");
}

// -------------------------
// FORMAT DATE
// -------------------------
function pretty(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

// -------------------------
// LOAD GAMES
// -------------------------
async function loadGames() {
  var container = document.getElementById("games-container");
  var dates;
  try {
    var res = await fetch("/mlb-boxscores/data/index.json");
    if (!res.ok) throw new Error("index.json fetch failed: " + res.status);
    dates = await res.json();
    if (!dates.length) { container.innerHTML = "No data."; return; }
  } catch (e) {
    container.innerHTML = "Error: " + e.message;
    return;
  }

  var date = dates.slice().sort().reverse()[0];
  document.getElementById("dateLabel").textContent = "(" + pretty(date) + ")";

  var games;
  try {
    var res2 = await fetch("/mlb-boxscores/data/boxscores-" + date + ".json");
    if (!res2.ok) throw new Error("boxscores fetch failed: " + res2.status);
    games = await res2.json();
  } catch (e) {
    container.innerHTML = "Error: " + e.message;
    return;
  }

  if (!games.length) { container.innerHTML = "No games found."; return; }

  var html = "<table style='border-collapse:collapse;width:100%;background:white;border:1px solid #ddd;border-radius:8px;overflow:hidden;font-size:0.9em;'><tbody>";

  for (var i = 0; i < games.length; i++) {
    var g = games[i];
    var awayWon = g.awayScore > g.homeScore;
    var homeWon = g.homeScore > g.awayScore;
    var link = "/mlb-boxscores/game.html?gamePk=" + g.gamePk;
    var awayStr = awayWon ? "<strong>" + g.away + " " + g.awayScore + "</strong>" : g.away + " " + g.awayScore;
    var homeStr = homeWon ? "<strong>" + g.home + " " + g.homeScore + "</strong>" : g.home + " " + g.homeScore;
    var bg = i % 2 === 0 ? "" : " style='background:#f9f9f9;'";

    html += "<tr" + bg + "><td style='padding:8px 14px;border-bottom:1px solid #f0f0f0;'>";
    html += "<a href='" + link + "' style='text-decoration:none;color:#003087;'>" + awayStr + " &nbsp;—&nbsp; " + homeStr + "</a>";
    html += "</td></tr>";
  }

  html += "</tbody></table>";
  container.innerHTML = html;
}

// -------------------------
// TEAM MODAL
// -------------------------
document.getElementById("teamModal").addEventListener("click", function(e) {
  if (e.target === this) closeTeamModal();
});

function closeTeamModal() {
  document.getElementById("teamModal").classList.remove("open");
}

async function showTeam(teamId, teamName, wins, losses, pct) {
  document.getElementById("modalTeamLogo").src = "https://www.mlbstatic.com/team-logos/" + teamId + ".svg";
  document.getElementById("modalTeamName").textContent = teamName;
  document.getElementById("modalTeamRecord").textContent = wins + "-" + losses + " (" + pct + ")";
  document.getElementById("modalTeamBody").innerHTML = "<div class=\"modal-loading\">Loading...</div>";
  document.getElementById("teamModal").classList.add("open");

  try {
    var season = new Date().getFullYear();
    var res = await fetch("https://statsapi.mlb.com/api/v1/teams/" + teamId + "/stats?stats=season&season=" + season + "&group=hitting,pitching&sportId=1");
    var data = await res.json();
    var html = "";

    if (!data.stats || !data.stats.length) {
      html = "No stats available.";
    } else {
      for (var i = 0; i < data.stats.length; i++) {
        var group = data.stats[i];
        var groupName = group.group && group.group.displayName ? group.group.displayName : "";
        var splits = group.splits;
        if (!splits || !splits.length) continue;
        var s = splits[0].stat;

        if (groupName === "hitting") {
          html += "<div class=\"modal-section-title\">Team Batting</div>";
          html += makeStatRow("AVG", s.avg || ".000");
          html += makeStatRow("OBP", s.obp || ".000");
          html += makeStatRow("SLG", s.slg || ".000");
          html += makeStatRow("OPS", s.ops || ".000");
          html += makeStatRow("HR", s.homeRuns || 0);
          html += makeStatRow("RBI", s.rbi || 0);
          html += makeStatRow("R", s.runs || 0);
          html += makeStatRow("SB", s.stolenBases || 0);
          html += makeStatRow("SO", s.strikeOuts || 0);
        }
        if (groupName === "pitching") {
          html += "<div class=\"modal-section-title\">Team Pitching</div>";
          html += makeStatRow("ERA", s.era || "-.--");
          html += makeStatRow("WHIP", s.whip || "-.--");
          html += makeStatRow("SO", s.strikeOuts || 0);
          html += makeStatRow("BB", s.baseOnBalls || 0);
          html += makeStatRow("HR Allowed", s.homeRuns || 0);
          html += makeStatRow("Saves", s.saves || 0);
        }
      }
    }

    document.getElementById("modalTeamBody").innerHTML = html;
  } catch (e) {
    document.getElementById("modalTeamBody").innerHTML = "Error: " + e.message;
  }
}

function makeStatRow(label, value) {
  return "<div class=\"modal-stat-row\"><span class=\"modal-stat-label\">" + label + "</span><span class=\"modal-stat-value\">" + value + "</span></div>";
}

// -------------------------
// LOAD STANDINGS
// -------------------------
async function loadStandings() {
  var container = document.getElementById("standings-container");
  var divisionNames = {
    200: "AL West", 201: "AL East", 202: "AL Central",
    203: "NL West", 204: "NL East", 205: "NL Central"
  };
  var alOrder = [201, 202, 200];
  var nlOrder = [204, 205, 203];

  try {
    var res = await fetch("https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=2026&standingsTypes=regularSeason");
    if (!res.ok) throw new Error("Standings fetch failed: " + res.status);
    var data = await res.json();

    var recMap = {};
    for (var i = 0; i < data.records.length; i++) {
      recMap[data.records[i].division.id] = data.records[i];
    }

    function getRecord(splitRecords, type) {
      if (!splitRecords) return "0-0";
      for (var i = 0; i < splitRecords.length; i++) {
        if (splitRecords[i].type === type) return splitRecords[i].wins + "-" + splitRecords[i].losses;
      }
      return "0-0";
    }

    function buildDivisions(divOrder) {
      var html = "<div class=\"standings-grid\">";
      for (var i = 0; i < divOrder.length; i++) {
        var rec = recMap[divOrder[i]];
        if (!rec) continue;
        var divName = divisionNames[divOrder[i]] || ("Division " + divOrder[i]);
        var teams = rec.teamRecords.slice().sort(function(a, b) {
          return parseFloat(b.winningPercentage) - parseFloat(a.winningPercentage);
        });

        html += "<div class=\"division-block\">";
        html += "<h3>" + divName + "</h3>";
        html += "<table class=\"standings-table\"><thead><tr>";
        html += "<th>Team</th><th class=\"num\">W</th><th class=\"num\">L</th><th class=\"num\">PCT</th><th class=\"num\">GB</th><th class=\"num\">Home</th><th class=\"num\">Away</th><th class=\"num\">Strk</th>";
        html += "</tr></thead><tbody>";

        for (var j = 0; j < teams.length; j++) {
          var t = teams[j];
          var gb = t.gamesBack === "-" ? "&mdash;" : t.gamesBack;
          var streak = t.streak && t.streak.streakCode ? t.streak.streakCode : "&mdash;";
          var logoUrl = "https://www.mlbstatic.com/team-logos/" + t.team.id + ".svg";
          var w = t.leagueRecord ? t.leagueRecord.wins : t.wins;
          var l = t.leagueRecord ? t.leagueRecord.losses : t.losses;
          var pct = t.winningPercentage || ".000";
          var splits = t.records ? t.records.splitRecords : null;
          var homeRec = getRecord(splits, "home");
          var awayRec = getRecord(splits, "away");

          html += "<tr><td>";
          html += "<img class=\"team-logo\" src=\"" + logoUrl + "\" alt=\"\" onerror=\"this.style.display='none'\">";
          html += "<a class=\"team-link\" onclick=\"showTeam(" + t.team.id + ", '" + t.team.name.replace(/'/g, "\\'") + "', " + w + ", " + l + ", '" + pct + "')\">" + t.team.name + "</a>";
          html += "</td>";
          html += "<td class=\"num\">" + w + "</td>";
          html += "<td class=\"num\">" + l + "</td>";
          html += "<td class=\"num\">" + pct + "</td>";
          html += "<td class=\"num\">" + gb + "</td>";
          html += "<td class=\"num\">" + homeRec + "</td>";
          html += "<td class=\"num\">" + awayRec + "</td>";
          html += "<td class=\"num\">" + streak + "</td>";
          html += "</tr>";
        }
        html += "</tbody></table></div>";
      }
      html += "</div>";
      return html;
    }

    var html = "";

    // AL sub-collapsible
    html += "<div class=\"sub-collapsible\">";
    html += "<div class=\"sub-collapsible-header\" onclick=\"toggleSub('al-body', 'al-arrow')\">";
    html += "<span>American League</span><span class=\"sub-collapsible-arrow open\" id=\"al-arrow\">&#9660;</span>";
    html += "</div>";
    html += "<div class=\"sub-collapsible-body open\" id=\"al-body\">" + buildDivisions(alOrder) + "</div>";
    html += "</div>";

    // NL sub-collapsible
    html += "<div class=\"sub-collapsible\">";
    html += "<div class=\"sub-collapsible-header\" onclick=\"toggleSub('nl-body', 'nl-arrow')\">";
    html += "<span>National League</span><span class=\"sub-collapsible-arrow open\" id=\"nl-arrow\">&#9660;</span>";
    html += "</div>";
    html += "<div class=\"sub-collapsible-body open\" id=\"nl-body\">" + buildDivisions(nlOrder) + "</div>";
    html += "</div>";

    container.innerHTML = html;

  } catch (e) {
    container.innerHTML = "Error loading standings: " + e.message;
  }
}

// -------------------------
// LOAD LEADERS
// -------------------------
var hittingStats = [
  { label: "Batting Avg", stat: "avg" },
  { label: "Home Runs", stat: "homeRuns" },
  { label: "RBI", stat: "rbi" }
];
var pitchingStats = [
  { label: "Wins", stat: "wins" },
  { label: "Strikeouts", stat: "strikeOuts" },
  { label: "ERA", stat: "era" }
];

async function fetchLeaders(stat, leagueId) {
  var statGroup = (stat === "wins" || stat === "strikeOuts" || stat === "era") ? "pitching" : "hitting";
  var res = await fetch(
    "https://statsapi.mlb.com/api/v1/stats/leaders?leaderCategories=" + stat +
    "&leagueId=" + leagueId +
    "&limit=10" +
    "&statGroup=" + statGroup +
    "&playerPool=qualified"
  );
  var data = await res.json();
  var leaders = (data.leagueLeaders && data.leagueLeaders[0] && data.leagueLeaders[0].leaders) ? data.leagueLeaders[0].leaders : [];

  var ascStats = ["era"];
  if (ascStats.indexOf(stat) !== -1) {
    leaders.sort(function(a, b) { return parseFloat(a.value) - parseFloat(b.value); });
  } else {
    leaders.sort(function(a, b) { return parseFloat(b.value) - parseFloat(a.value); });
  }

  return leaders.slice(0, 5);
}

function buildLeaderCard(label, leaders) {
  var html = "<div class=\"leader-card\">";
  html += "<div class=\"leader-card-title\">" + label + "</div>";
  for (var i = 0; i < leaders.length; i++) {
    var p = leaders[i];
    var personId = p.person && p.person.id ? p.person.id : "";
    var teamId = p.team && p.team.id ? p.team.id : "";
    var name = p.person && p.person.fullName ? p.person.fullName : "Unknown";
    html += "<div class=\"leader-row\">";
    html += "<span class=\"leader-rank\">" + (i + 1) + "</span>";
    if (personId) html += "<img class=\"headshot\" src=\"https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_60,q_auto:best/v1/people/" + personId + "/headshot/67/current\" onerror=\"this.style.display='none'\">";
    html += "<span class=\"leader-name\">" + name + (teamId ? " <img class=\"tlogo\" src=\"https://www.mlbstatic.com/team-logos/" + teamId + ".svg\" onerror=\"this.style.display='none'\">" : "") + "</span>";
    html += "<span class=\"leader-value\">" + (p.value !== undefined ? p.value : "-") + "</span>";
    html += "</div>";
  }
  html += "</div>";
  return html;
}

async function buildLeagueLeaders(leagueId, bodyId, arrowId) {
  var html = "";
  html += "<div class=\"leaders-group-title\">Hitting</div><div class=\"leaders-grid\">";
  for (var hi = 0; hi < hittingStats.length; hi++) {
    var leaders = await fetchLeaders(hittingStats[hi].stat, leagueId);
    html += buildLeaderCard(hittingStats[hi].label, leaders);
  }
  html += "</div>";
  html += "<div class=\"leaders-group-title\">Pitching</div><div class=\"leaders-grid\">";
  for (var pi = 0; pi < pitchingStats.length; pi++) {
    var pleaders = await fetchLeaders(pitchingStats[pi].stat, leagueId);
    html += buildLeaderCard(pitchingStats[pi].label, pleaders);
  }
  html += "</div>";
  document.getElementById(bodyId).innerHTML = html;
}

async function loadLeaders() {
  var container = document.getElementById("leaders-container");

  var html = "";

  // AL sub-collapsible
  html += "<div class=\"sub-collapsible\">";
  html += "<div class=\"sub-collapsible-header\" onclick=\"toggleSub('al-leaders-body', 'al-leaders-arrow')\">";
  html += "<span>American League</span><span class=\"sub-collapsible-arrow open\" id=\"al-leaders-arrow\">&#9660;</span>";
  html += "</div>";
  html += "<div class=\"sub-collapsible-body open\" id=\"al-leaders-body\"><div class=\"modal-loading\">Loading...</div></div>";
  html += "</div>";

  // NL sub-collapsible
  html += "<div class=\"sub-collapsible\">";
  html += "<div class=\"sub-collapsible-header\" onclick=\"toggleSub('nl-leaders-body', 'nl-leaders-arrow')\">";
  html += "<span>National League</span><span class=\"sub-collapsible-arrow open\" id=\"nl-leaders-arrow\">&#9660;</span>";
  html += "</div>";
  html += "<div class=\"sub-collapsible-body open\" id=\"nl-leaders-body\"><div class=\"modal-loading\">Loading...</div></div>";
  html += "</div>";

  container.innerHTML = html;

  try {
    await buildLeagueLeaders(103, "al-leaders-body", "al-leaders-arrow");
    await buildLeagueLeaders(104, "nl-leaders-body", "nl-leaders-arrow");
  } catch (e) {
    container.innerHTML = "Error loading leaders: " + e.message;
  }
}

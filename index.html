<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>
</head>

<body>
  <h1>MLB Boxscore Archive</h1>

  <!-- Archive list -->
  <div id="list"></div>

  <!-- Standings -->
  <h2>Standings</h2>
  <div id="standings">Loading standings...</div>

  <script>
    // -------------------------
    // ARCHIVE DATES
    // -------------------------
    fetch("/mlb-boxscores/data/index.json")
      .then(r => r.json())
      .then(dates => {
        dates.sort().reverse();

        document.getElementById("list").innerHTML =
          dates.map(d =>
            `<p><a href="day.html?date=${d}">${d}</a></p>`
          ).join("");
      })
      .catch(err => {
        console.error("Index load error:", err);
        document.getElementById("list").innerHTML =
          "Failed to load archive.";
      });

    // -------------------------
    // STANDINGS
    // -------------------------
    async function loadStandings() {
      try {
        const res = await fetch(
          "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
        );

        const data = await res.json();
        const records = data.records || [];

        let html = "";

        records.forEach(division => {

          const firstTeam = division.teamRecords?.[0];

          const league =
            firstTeam?.league?.name ||
            firstTeam?.leagueRecord?.league?.name ||
            "MLB Standings";

          html += `<h3>${league}</h3>`;

          html += `
            <table border="1" cellpadding="4" cellspacing="0">
              <tr>
                <th>Team</th>
                <th>W</th>
                <th>L</th>
                <th>GB</th>
              </tr>
          `;

          division.teamRecords.forEach(team => {
            html += `
              <tr>
                <td>${team.team.name}</td>
                <td>${team.wins}</td>
                <td>${team.losses}</td>
                <td>${team.gamesBack || "-"}</td>
              </tr>
            `;
          });

          html += `</table><br>`;
        });

        document.getElementById("standings").innerHTML = html;

      } catch (err) {
        console.error("Standings error:", err);
        document.getElementById("standings").innerHTML =
          "Failed to load standings.";
      }
    }

    // Run standings
    loadStandings();
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .top {
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    table {
      border-collapse: collapse;
      margin-bottom: 15px;
      width: 100%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }

    th {
      background: #f2f2f2;
    }

    h2 {
      margin-top: 30px;
    }

    h3 {
      margin-top: 20px;
    }

    .section {
      margin-bottom: 25px;
    }
  </style>
</head>

<body>

<h1>MLB Boxscore Archive</h1>

<!-- ARCHIVE -->
<div class="top">
  <h2>Games Archive</h2>
  <div id="list"></div>
</div>

<!-- SIDE BY SIDE -->
<div class="grid">

  <!-- STANDINGS -->
  <div>
    <h2>Standings</h2>
    <div id="standings">Loading standings...</div>
  </div>

  <!-- LEADERS -->
  <div>
    <h2>League Leaders</h2>

    <h3>American League</h3>
    <div id="al-leaders">Loading...</div>

    <h3>National League</h3>
    <div id="nl-leaders">Loading...</div>
  </div>

</div>

<script>
  // -------------------------
  // ARCHIVE
  // -------------------------
  fetch("/mlb-boxscores/data/index.json")
    .then(r => r.json())
    .then(dates => {
      dates.sort().reverse();

      document.getElementById("list").innerHTML =
        dates.map(d =>
          `<p><a href="day.html?date=${d}">${d}</a></p>`
        ).join("");
    });

  // -------------------------
  // STANDINGS (TABLES)
  // -------------------------
  async function loadStandings() {
    const res = await fetch(
      "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
    );

    const data = await res.json();
    const records = data.records || [];

    let html = "";

    records.forEach(group => {
      html += `<h3>${group.league?.name || "MLB"}</h3>`;

      html += `
        <table>
          <tr>
            <th>Team</th>
            <th>W</th>
            <th>L</th>
            <th>GB</th>
          </tr>
      `;

      group.teamRecords.forEach(team => {
        html += `
          <tr>
            <td>${team.team.name}</td>
            <td>${team.wins}</td>
            <td>${team.losses}</td>
            <td>${team.gamesBack || "-"}</td>
          </tr>
        `;
      });

      html += `</table>`;
    });

    document.getElementById("standings").innerHTML = html;
  }

  // -------------------------
  // LEADERS (AL / NL SPLIT)
  // -------------------------
  async function loadLeagueLeaders(leagueId, elementId) {
    const stats = [
      { label: "Home Runs", stat: "homeRuns" },
      { label: "RBI", stat: "rbi" },
      { label: "Batting Avg", stat: "battingAverage" },
      { label: "Wins", stat: "wins" },
      { label: "ERA", stat: "earnedRunAverage" },
      { label: "Strikeouts", stat: "strikeOuts" }
    ];

    let html = "";

    for (const s of stats) {
      const res = await fetch(
        `https://statsapi.mlb.com/api/v1/stats/leaders?leaderCategories=${s.stat}&leagueId=${leagueId}&limit=5`
      );

      const data = await res.json();

      const leaders = data.leagueLeaders?.[0]?.leaders || [];

      html += `<h4>${s.label}</h4>`;

      html += `
        <table>
          <tr>
            <th>Player</th>
            <th>Value</th>
          </tr>
      `;

      leaders.forEach(p => {
        html += `
          <tr>
            <td>${p.person?.fullName || "Unknown"}</td>
            <td>${p.value ?? "-"}</td>
          </tr>
        `;
      });

      html += `</table>`;
    }

    document.getElementById(elementId).innerHTML = html;
  }

  // INIT
  loadStandings();
  loadLeagueLeaders(103, "al-leaders"); // AL
  loadLeagueLeaders(104, "nl-leaders"); // NL
</script>

</body>
</html>

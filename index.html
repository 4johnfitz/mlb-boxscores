<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscores</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f9f9f9; color: #111; }
    h1, h2 { margin-bottom: 10px; }
    .top-nav { margin-bottom: 20px; }
    .top-nav a { margin-right: 15px; text-decoration: none; color: #0055aa; font-weight: bold; }
    .top-nav a:hover { text-decoration: underline; }
    .date { color: #666; margin-left: 10px; font-size: 0.85em; font-weight: normal; }

    /* Games */
    .games { margin-bottom: 30px; }
    .games div { margin-bottom: 6px; }
    .games a { text-decoration: none; color: #003087; }
    .games a:hover { text-decoration: underline; }
    .games .state { color: #888; font-size: 0.85em; margin-left: 8px; }

    /* Standings */
    .standings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }
    .division-block {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
    }
    .division-block h3 {
      margin: 0 0 8px 0;
      font-size: 0.95em;
      color: #003087;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85em;
    }
    .standings-table th {
      text-align: left;
      color: #888;
      font-weight: normal;
      padding: 2px 4px;
    }
    .standings-table th.num, .standings-table td.num { text-align: right; }
    .standings-table td { padding: 3px 4px; }
    .standings-table tr:nth-child(even) td { background: #f5f5f5; }
    .team-logo { width: 18px; height: 18px; vertical-align: middle; margin-right: 5px; }
    #standings-container { color: #555; }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="/mlb-boxscores/">Home</a>
  <a href="/mlb-boxscores/leaders.html">Leaders</a>
</nav>

<h1>Latest Games <span id="dateLabel" class="date"></span></h1>
<div class="games" id="games">Loading...</div>

<h2 style="margin-top: 32px;">Standings</h2>
<div id="standings-container">Loading standings...</div>

<script>
// -------------------------
// FORMAT DATE
// -------------------------
function pretty(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric"
  });
}

// -------------------------
// LOAD GAMES
// -------------------------
async function loadGames() {
  var gamesDiv = document.getElementById("games");

  var dates;
  try {
    var res = await fetch("/mlb-boxscores/data/index.json");
    if (!res.ok) throw new Error("index.json fetch failed: " + res.status + " " + res.statusText);
    dates = await res.json();
    if (!dates.length) {
      gamesDiv.innerHTML = "index.json is empty.";
      return;
    }
  } catch (e) {
    gamesDiv.innerHTML = "Error loading index.json: " + e.message;
    return;
  }

  var date = dates.slice().sort().reverse()[0];
  document.getElementById("dateLabel").textContent = "(" + pretty(date) + ")";

  var games;
  try {
    var res2 = await fetch("/mlb-boxscores/data/boxscores-" + date + ".json");
    if (!res2.ok) throw new Error("boxscores fetch failed: " + res2.status + " " + res2.statusText);
    games = await res2.json();
  } catch (e) {
    gamesDiv.innerHTML = "Error loading boxscores: " + e.message;
    return;
  }

  if (!games.length) {
    gamesDiv.innerHTML = "No games found for this date.";
    return;
  }

  var html = "";
  for (var i = 0; i < games.length; i++) {
    var g = games[i];
    html += "<div>" +
      '<a href="/mlb-boxscores/game.html?gamePk=' + g.gamePk + '">' +
      g.away + " " + g.awayScore + ", " + g.home + " " + g.homeScore +
      "</a>" +
      '<span class="state"> — Final</span>' +
      "</div>";
  }

  gamesDiv.innerHTML = html;
}

// -------------------------
// LOAD STANDINGS
// -------------------------
async function loadStandings() {
  var container = document.getElementById("standings-container");

  var divisionNames = {
    200: "American League West",
    201: "American League East",
    202: "American League Central",
    203: "National League West",
    204: "National League East",
    205: "National League Central"
  };

  var divisionOrder = [201, 202, 200, 204, 205, 203];

  try {
    var res = await fetch("https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=2026&standingsTypes=regularSeason");
    if (!res.ok) throw new Error("Standings fetch failed: " + res.status);
    var data = await res.json();

    var sorted = data.records.slice().sort(function(a, b) {
      var ai = divisionOrder.indexOf(a.division.id);
      var bi = divisionOrder.indexOf(b.division.id);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });

    var html = '<div class="standings-grid">';

    for (var i = 0; i < sorted.length; i++) {
      var rec = sorted[i];
      var divName = divisionNames[rec.division.id] || ("Division " + rec.division.id);

      var teams = rec.teamRecords.slice().sort(function(a, b) {
        return parseFloat(b.winningPercentage) - parseFloat(a.winningPercentage);
      });

      html += '<div class="division-block">';
      html += "<h3>" + divName + "</h3>";
      html += '<table class="standings-table">';
      html += "<thead><tr>";
      html += "<th>Team</th>";
      html += '<th class="num">W</th>';
      html += '<th class="num">L</th>';
      html += '<th class="num">GB</th>';
      html += '<th class="num">Strk</th>';
      html += "</tr></thead><tbody>";

      for (var j = 0; j < teams.length; j++) {
        var t = teams[j];
        var gb = t.gamesBack === "-" ? "&mdash;" : t.gamesBack;
        var streak = t.streak && t.streak.streakCode ? t.streak.streakCode : "&mdash;";
        var logoUrl = "https://www.mlbstatic.com/team-logos/" + t.team.id + ".svg";
        var w = t.leagueRecord ? t.leagueRecord.wins : t.wins;
        var l = t.leagueRecord ? t.leagueRecord.losses : t.losses;
        html += "<tr><td>";
        html += '<img class="team-logo" src="' + logoUrl + '" alt="" onerror="this.style.display=\'none\'">';
        html += t.team.name;
        html += "</td>";
        html += '<td class="num">' + w + "</td>";
        html += '<td class="num">' + l + "</td>";
        html += '<td class="num">' + gb + "</td>";
        html += '<td class="num">' + streak + "</td>";
        html += "</tr>";
      }

      html += "</tbody></table></div>";
    }

    html += "</div>";
    container.innerHTML = html;

  } catch (e) {
    container.innerHTML = "Error loading standings: " + e.message;
  }
}

// -------------------------
// INIT
// -------------------------
loadGames();
loadStandings();
</script>
</body>
</html>

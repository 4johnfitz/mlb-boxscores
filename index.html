<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .top-nav {
      margin-bottom: 20px;
    }

    .top-nav a {
      margin-right: 15px;
      text-decoration: none;
      color: blue;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #f2f2f2;
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h1>MLB Boxscore Archive</h1>

<div class="top-nav">
  <a href="index.html">Home</a>
  <a href="leaders.html">League Leaders</a>
</div>

<!-- ARCHIVE -->
<div>
  <h2>Games Archive</h2>
  <div id="list">Loading...</div>
</div>

<!-- GRID -->
<div class="grid">

  <!-- STANDINGS -->
  <div>
    <h2>Standings</h2>
    <div id="standings">Loading standings...</div>
  </div>

</div>

<script>

//
// -------------------------
// ARCHIVE DATES
// -------------------------
//
fetch("/mlb-boxscores/data/index.json")
  .then(r => r.json())
  .then(dates => {
    dates.sort().reverse();

    document.getElementById("list").innerHTML =
      dates.map(d =>
        `<p><a href="day.html?date=${d}">${d}</a></p>`
      ).join("");
  })
  .catch(err => {
    console.error("Index load error:", err);
    document.getElementById("list").innerHTML =
      "Failed to load archive.";
  });

//
// -------------------------
// STANDINGS (FINAL FIXED VERSION)
// -------------------------
//
async function loadStandings() {
  try {
    const res = await fetch(
      "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
    );

    const data = await res.json();
    const records = data.records || [];

    const indexRes = await fetch("/mlb-boxscores/data/index.json");
    const dates = await indexRes.json();
    const latestDate = dates.sort().reverse()[0];

    let html = "";

    records.forEach(group => {

      html += `<h3>${group.league?.name || "MLB"}</h3>`;

      html += `
        <table>
          <tr>
            <th>Team</th>
            <th>W</th>
            <th>L</th>
            <th>GB</th>
            <th>Streak</th>
            <th>Last Game</th>
          </tr>
      `;

      group.teamRecords.forEach(team => {

        const streak = team.streak?.streakCode || "-";

        const lastGameLink = latestDate
          ? `<a href="day.html?date=${latestDate}">View</a>`
          : "-";

        html += `
          <tr>
            <td>${team.team.name}</td>
            <td>${team.wins}</td>
            <td>${team.losses}</td>
            <td>${team.gamesBack || "-"}</td>
            <td>${streak}</td>
            <td>${lastGameLink}</td>
          </tr>
        `;
      });

      html += `</table>`;
    });

    document.getElementById("standings").innerHTML = html;

  } catch (err) {
    console.error("Standings error:", err);
    document.getElementById("standings").innerHTML =
      "Failed to load standings.";
  }
}

//
// INIT
//
loadStandings();

</script>

</body>
</html>

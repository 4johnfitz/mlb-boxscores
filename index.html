
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team img {
      width: 24px;
      height: 24px;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    h2 {
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <h1>MLB Dashboard</h1>

  <div class="grid">

    <!-- ARCHIVE -->
    <div>
      <h2>Games Archive</h2>
      <div id="list"></div>
    </div>

    <!-- STANDINGS -->
    <div>
      <h2>Standings</h2>
      <div id="standings">Loading...</div>
    </div>

  </div>

  <!-- LEADERS -->
  <h2>League Leaders</h2>
  <div id="leaders">Loading...</div>

  <script>
    // -------------------------
    // ARCHIVE
    // -------------------------
    fetch("/mlb-boxscores/data/index.json")
      .then(r => r.json())
      .then(dates => {
        dates.sort().reverse();
        document.getElementById("list").innerHTML =
          dates.map(d =>
            `<div class="card"><a href="day.html?date=${d}">${d}</a></div>`
          ).join("");
      });

    // -------------------------
    // STANDINGS (CARDS + LOGOS)
    // -------------------------
    async function loadStandings() {
      const res = await fetch(
        "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
      );

      const data = await res.json();
      const records = data.records || [];

      let html = "";

      records.forEach(group => {
        html += `<h3>${group.league?.name || "MLB"}</h3>`;

        group.teamRecords.forEach(team => {
          const id = team.team.id;

          html += `
            <div class="card">
              <div class="team">
                <img src="https://www.mlbstatic.com/team-logos/team-cap-on-dark/${id}.svg">
                <strong>${team.team.name}</strong>
              </div>
              <div>
                ${team.wins}-${team.losses} • GB: ${team.gamesBack || "-"}
              </div>
            </div>
          `;
        });
      });

      document.getElementById("standings").innerHTML = html;
    }

    // -------------------------
    // LEADERS (WITH PHOTOS)
    // -------------------------
    async function loadLeaders() {
      const stats = [
        { label: "Home Runs", stat: "homeRuns" },
        { label: "RBI", stat: "rbi" },
        { label: "Batting Avg", stat: "battingAverage" },
        { label: "Wins", stat: "wins" },
        { label: "ERA", stat: "earnedRunAverage" },
        { label: "Strikeouts", stat: "strikeOuts" }
      ];

      let html = "";

      for (const s of stats) {
        const res = await fetch(
          `https://statsapi.mlb.com/api/v1/stats/leaders?leaderCategories=${s.stat}&limit=5`
        );

        const data = await res.json();

        const leaders =
          data.leagueLeaders?.[0]?.leaders || [];

        html += `<h3>${s.label}</h3>`;

        leaders.forEach(p => {
          const id = p.person?.id;

          html += `
            <div class="card player">
              <img src="https://img.mlbstatic.com/mlb-photos/image/upload/w_200,q_auto:best/v1/people/${id}/headshot/67/current">
              <div>
                <strong>${p.person?.fullName}</strong><br>
                ${p.value}
              </div>
            </div>
          `;
        });
      }

      document.getElementById("leaders").innerHTML = html;
    }

    // INIT
    loadStandings();
    loadLeaders();
  </script>
</body>
</html>

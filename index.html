<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscores</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f9f9f9; color: #111; }
    h1, h2 { margin-bottom: 10px; }
    .top-nav { margin-bottom: 20px; }
    .top-nav a { margin-right: 15px; text-decoration: none; color: #0055aa; font-weight: bold; }
    .top-nav a:hover { text-decoration: underline; }
    .date { color: #666; margin-left: 10px; font-size: 0.85em; font-weight: normal; }

    /* Games */
    .games { margin-bottom: 30px; }
    .games div { margin-bottom: 6px; }
    .games a { text-decoration: none; color: #003087; }
    .games a:hover { text-decoration: underline; }
    .games .state { color: #888; font-size: 0.85em; margin-left: 8px; }

    /* Standings */
    .standings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }
    .division-block {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
    }
    .division-block h3 {
      margin: 0 0 8px 0;
      font-size: 0.95em;
      color: #003087;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85em;
    }
    .standings-table th {
      text-align: left;
      color: #888;
      font-weight: normal;
      padding: 2px 4px;
    }
    .standings-table th.num, .standings-table td.num { text-align: right; }
    .standings-table td { padding: 3px 4px; }
    .standings-table tr:nth-child(even) td { background: #f5f5f5; }
    .team-logo { width: 18px; height: 18px; vertical-align: middle; margin-right: 5px; }
    #standings-container { color: #555; }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="/mlb-boxscores/">Home</a>
  <a href="/mlb-boxscores/leaders.html">Leaders</a>
</nav>

<h1>Latest Games <span id="dateLabel" class="date"></span></h1>
<div class="games" id="games">Loading...</div>

<h2 style="margin-top: 32px;">Standings</h2>
<div id="standings-container">Loading standings...</div>

<script>
// -------------------------
// FORMAT DATE
// -------------------------
function pretty(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric"
  });
}

// -------------------------
// LOAD GAMES
// -------------------------
async function loadGames() {
  const gamesDiv = document.getElementById("games");

  let dates;
  try {
    const res = await fetch("/mlb-boxscores/data/index.json");
    if (!res.ok) throw new Error(`index.json fetch failed: ${res.status} ${res.statusText}`);
    dates = await res.json();
    if (!dates.length) {
      gamesDiv.innerHTML = "index.json is empty.";
      return;
    }
  } catch (e) {
    gamesDiv.innerHTML = `Error loading index.json: ${e.message}`;
    return;
  }

  const date = dates.sort().reverse()[0];
  document.getElementById("dateLabel").textContent = `(${pretty(date)})`;

  let games;
  try {
    const res = await fetch(`/mlb-boxscores/data/boxscores-${date}.json`);
    if (!res.ok) throw new Error(`boxscores fetch failed: ${res.status} ${res.statusText}`);
    games = await res.json();
  } catch (e) {
    gamesDiv.innerHTML = `Error loading boxscores: ${e.message}`;
    return;
  }

  if (!games.length) {
    gamesDiv.innerHTML = "No games found for this date.";
    return;
  }

  let html = "";
  games.forEach(g => {
    html += `
      <div>
        <a href="/mlb-boxscores/game.html?gamePk=${g.gamePk}">
          ${g.away} ${g.awayScore}, ${g.home} ${g.homeScore}
        </a>
        <span class="state">— Final</span>
      </div>
    `;
  });

  gamesDiv.innerHTML = html;
}

// -------------------------
// LOAD STANDINGS
// -------------------------
async function loadStandings() {
  const container = document.getElementById("standings-container");
  try {
    const res = await fetch("https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=2026&standingsTypes=regularSeason");
    if (!res.ok) throw new Error(`Standings fetch failed: ${res.status} ${res.statusText}`);
    const data = await res.json();

    const divisionOrder = [
      "American League East",
      "American League Central",
      "American League West",
      "National League East",
      "National League Central",
      "National League West"
    ];

    const sorted = data.records.slice().sort((a, b) => {
      const ai = divisionOrder.indexOf(a.division.name);
      const bi = divisionOrder.indexOf(b.division.name);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });

    let html = '<div class="standings-grid">';

    sorted.forEach(rec => {
      const divName = rec.division.name;
      const teams = rec.teamRecords.slice().sort((a, b) =>
        b.winningPercentage - a.winningPercentage
      );

      html += `
        <div class="division-block">
          <h3>${divName}</h3>
          <table class="standings-table">
            <thead>
              <tr>
                <th>Team</th>
                <th class="num">W</th>
                <th class="num">L</th>
                <th class="num">GB</th>
                <th class="num">Strk</th>
              </tr>
            </thead>
            <tbody>
      `;

      teams.forEach(t => {
        const gb = t.gamesBack === "-" ? "—" : t.gamesBack;
        const streak = t.streak?.streakCode ?? "—";
        const logoUrl = `https://www.mlbstatic.com/team-logos/${t.team.id}.svg`;
        html += `
          <tr>
            <td>
              <img class="team-logo" src="${logoUrl}" alt="" onerror="this.style.display='none'">
              ${t.team.name}
            </td>
            <td class="num">${t.wins}</td>
            <td class="num">${t.losses}</td>
            <td class="num">${gb}</td>
            <td class="num">${streak}</td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
    });

    html += "</div>";
    container.innerHTML = html;

  } catch (e) {
    container.innerHTML = `Error loading standings: ${e.message}`;
  }
}

// -------------------------
// INIT
// -------------------------
loadGames();
loadStandings();
</script>
</body>
</html>

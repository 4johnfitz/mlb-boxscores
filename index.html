<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>
</head>

<body>
  <h1>MLB Boxscore Archive</h1>

  <!-- Archive list -->
  <div id="list"></div>

  <h2>League Leaders</h2>
  <div id="leaders">Loading leaders...</div>

  <script>
    // -------------------------
    // ARCHIVE DATES
    // -------------------------
    fetch("/mlb-boxscores/data/index.json")
      .then(r => r.json())
      .then(dates => {
        dates.sort().reverse();

        document.getElementById("list").innerHTML =
          dates.map(d =>
            `<p><a href="day.html?date=${d}">${d}</a></p>`
          ).join("");
      })
      .catch(err => {
        console.error("Index load error:", err);
        document.getElementById("list").innerHTML =
          "Failed to load archive.";
      });

    // -------------------------
    // LEAGUE LEADERS
    // -------------------------
    async function loadLeaders() {
      const stats = [
        { label: "Home Runs", stat: "homeRuns" },
        { label: "RBI", stat: "rbi" },
        { label: "Batting Avg", stat: "battingAverage" },
        { label: "Wins", stat: "wins" },
        { label: "ERA", stat: "earnedRunAverage" },
        { label: "Strikeouts", stat: "strikeOuts" }
      ];

      let html = "";

      for (const s of stats) {
        try {
          const res = await fetch(
            `https://statsapi.mlb.com/api/v1/stats/leaders?leaderCategories=${s.stat}&season=2026&limit=5`
          );

          const data = await res.json();

          const items =
            data.leagueLeaders?.[0]?.leaders ||
            data.leagueLeaders?.[0]?.leaderStats || [];

          html += `<h3>${s.label}</h3>`;

          html += `
            <table border="1" cellpadding="4" cellspacing="0">
              <tr>
                <th>Player</th>
                <th>Value</th>
              </tr>
          `;

          items.forEach(p => {
            const name =
              p.person?.fullName ||
              p.name ||
              "Unknown";

            html += `
              <tr>
                <td>${name}</td>
                <td>${p.value}</td>
              </tr>
            `;
          });

          html += `</table><br>`;

        } catch (err) {
          console.error("Leader error:", s.stat, err);
          html += `<p>Failed to load ${s.label}</p>`;
        }
      }

      document.getElementById("leaders").innerHTML = html;
    }

    // Run leaders
    loadLeaders();
  </script>
</body>
</html>

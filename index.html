<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>

  <style>
    body { font-family: Arial; margin: 20px; }
    .top-nav { margin-bottom: 20px; }
    .top-nav a { margin-right: 15px; color: blue; text-decoration: none; }

    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 6px; }
    th { background: #f2f2f2; }

    .team-cell { display: flex; align-items: center; gap: 8px; }
    .team-cell img { width: 18px; height: 18px; }

    .games-list div { margin-bottom: 8px; }
    .state { margin-left: 10px; font-size: 12px; color: #666; }
    .date-label { margin-left: 10px; color: #666; }
  </style>
</head>

<body>

<h1>MLB Boxscore Archive</h1>

<div class="top-nav">
  <a href="index.html">Home</a>
  <a href="leaders.html">League Leaders</a>
</div>

<h2>
  Latest Games
  <span id="latest-date" class="date-label"></span>
</h2>

<div id="latest-games">Loading...</div>

<h2>Standings</h2>
<div id="standings">Loading...</div>

<script>

function getYesterday() {
  const d = new Date();
  d.setDate(d.getDate() - 1);

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric"
  });
}

async function loadLatestGames() {
  try {
    const date = getYesterday();

    document.getElementById("latest-date").textContent =
      `(${formatDate(date)})`;

    const res = await fetch(`/mlb-boxscores/data/boxscores-${date}.json`);
    const games = await res.json();

    if (!games.length) {
      document.getElementById("latest-games").innerHTML =
        "No games found.";
      return;
    }

    let html = `<div class="games-list">`;

    games.forEach(g => {
      html += `
        <div>
          <a href="game.html?gamePk=${g.gamePk}">
            ${g.away} ${g.awayScore}, ${g.home} ${g.homeScore}
          </a>
          <span class="state">${g.state}</span>
        </div>
      `;
    });

    html += `</div>`;

    document.getElementById("latest-games").innerHTML = html;

  } catch (e) {
    document.getElementById("latest-games").innerHTML = "Error loading games.";
  }
}

async function loadStandings() {
  const res = await fetch(
    "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
  );
  const data = await res.json();

  const map = {
    "American League East": "AL East",
    "American League Central": "AL Central",
    "American League West": "AL West",
    "National League East": "NL East",
    "National League Central": "NL Central",
    "National League West": "NL West"
  };

  let html = "";

  data.records.forEach(group => {
    const name = map[group.division.name] || group.division.name;

    html += `<h3>${name}</h3><table>
      <tr><th>Team</th><th>W</th><th>L</th><th>GB</th><th>Streak</th></tr>`;

    group.teamRecords.forEach(t => {
      html += `
        <tr>
          <td class="team-cell">
            <img src="https://www.mlbstatic.com/team-logos/${t.team.id}.svg">
            ${t.team.name}
          </td>
          <td>${t.wins}</td>
          <td>${t.losses}</td>
          <td>${t.gamesBack || "-"}</td>
          <td>${t.streak?.streakCode || "-"}</td>
        </tr>
      `;
    });

    html += `</table>`;
  });

  document.getElementById("standings").innerHTML = html;
}

loadLatestGames();
loadStandings();

</script>

</body>
</html>

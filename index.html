<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>
</head>

<body>
  <h1>MLB Boxscore Archive</h1>

  <!-- ARCHIVE -->
  <div id="list"></div>

  <!-- STANDINGS -->
  <h2>Standings</h2>
  <div id="standings">Loading standings...</div>

  <!-- LEADERS -->
  <h2>League Leaders</h2>
  <div id="leaders">Loading leaders...</div>

  <script>
    // -------------------------
    // ARCHIVE DATES
    // -------------------------
    fetch("/mlb-boxscores/data/index.json")
      .then(r => r.json())
      .then(dates => {
        dates.sort().reverse();

        document.getElementById("list").innerHTML =
          dates.map(d =>
            `<p><a href="day.html?date=${d}">${d}</a></p>`
          ).join("");
      })
      .catch(err => {
        console.error("Index load error:", err);
        document.getElementById("list").innerHTML =
          "Failed to load archive.";
      });

    // -------------------------
    // STANDINGS
    // -------------------------
    async function loadStandings() {
      try {
        const res = await fetch(
          "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
        );

        const data = await res.json();
        const records = data.records || [];

        let html = "";

        records.forEach(group => {
          const league =
            group.league?.name ||
            group.teamRecords?.[0]?.league?.name ||
            "MLB";

          html += `<h3>${league}</h3>`;

          html += `
            <table border="1" cellpadding="4" cellspacing="0">
              <tr>
                <th>Team</th>
                <th>W</th>
                <th>L</th>
                <th>GB</th>
              </tr>
          `;

          group.teamRecords.forEach(team => {
            html += `
              <tr>
                <td>${team.team.name}</td>
                <td>${team.wins}</td>
                <td>${team.losses}</td>
                <td>${team.gamesBack || "-"}</td>
              </tr>
            `;
          });

          html += `</table><br>`;
        });

        document.getElementById("standings").innerHTML = html;

      } catch (err) {
        console.error("Standings error:", err);
        document.getElementById("standings").innerHTML =
          "Failed to load standings.";
      }
    }

    // -------------------------
    // LEAGUE LEADERS
    // -------------------------
    async function loadLeaders() {
      const stats = [
        { label: "Home Runs", stat: "homeRuns" },
        { label: "RBI", stat: "rbi" },
        { label: "Batting Avg", stat: "battingAverage" },
        { label: "Wins", stat: "wins" },
        { label: "ERA", stat: "earnedRunAverage" },
        { label: "Strikeouts", stat: "strikeOuts" }
      ];

      let html = "";

      for (const s of stats) {
        try {
          const res = await fetch(
            `https://statsapi.mlb.com/api/v1/stats/leaders?leaderCategories=${s.stat}&limit=5`
          );

          const data = await res.json();

          const leaders =
            data.leagueLeaders?.[0]?.leaders ||
            data.leagueLeaders?.[0]?.leaderStats ||
            [];

          html += `<h3>${s.label}</h3>`;

          if (!leaders.length) {
            html += `<p>No data available</p>`;
            continue;
          }

          html += `
            <table border="1" cellpadding="4" cellspacing="0">
              <tr>
                <th>Player</th>
                <th>Value</th>
              </tr>
          `;

          leaders.forEach(p => {
            html += `
              <tr>
                <td>${p.person?.fullName || "Unknown"}</td>
                <td>${p.value ?? "-"}</td>
              </tr>
            `;
          });

          html += `</table><br>`;

        } catch (err) {
          console.error("Leader error:", s.stat, err);
          html += `<p>Error loading ${s.label}</p>`;
        }
      }

      document.getElementById("leaders").innerHTML = html;
    }

    // -------------------------
    // INIT
    // -------------------------
    loadStandings();
    loadLeaders();
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MLB Boxscore Archive</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .top-nav {
      margin-bottom: 20px;
    }

    .top-nav a {
      margin-right: 15px;
      text-decoration: none;
      color: blue;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f2f2f2;
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-top: 15px;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-cell img {
      width: 18px;
      height: 18px;
    }

    .games-list div {
      margin-bottom: 8px;
    }

    .games-list a {
      text-decoration: none;
      color: black;
      font-weight: 500;
    }

    .games-list a:hover {
      text-decoration: underline;
    }

    .state {
      margin-left: 10px;
      font-size: 12px;
      color: #666;
    }

    .date-label {
      font-size: 14px;
      color: #666;
      margin-left: 10px;
    }
  </style>
</head>

<body>

<h1>MLB Boxscore Archive</h1>

<div class="top-nav">
  <a href="index.html">Home</a>
  <a href="leaders.html">League Leaders</a>
</div>

<!-- LATEST GAMES -->
<div>
  <h2>
    Latest Games
    <span id="latest-date" class="date-label"></span>
  </h2>
  <div id="latest-games">Loading...</div>
</div>

<!-- STANDINGS -->
<div class="grid">
  <div>
    <h2>Standings</h2>
    <div id="standings">Loading standings...</div>
  </div>
</div>

<script>

//
// -------------------------
// FORMAT DATE
// -------------------------
//
function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric"
  });
}

//
// -------------------------
// LATEST GAMES
// -------------------------
//
async function loadLatestGames() {
  try {
    const res = await fetch("/mlb-boxscores/data/index.json");
    const dates = await res.json();

    const latestDate = dates.sort().reverse()[0];

    document.getElementById("latest-date").textContent =
      `(${formatDate(latestDate)})`;

    const gamesRes = await fetch(
      `/mlb-boxscores/data/boxscores-${latestDate}.json`
    );

    const games = await gamesRes.json();

    let html = `<div class="games-list">`;

    games.forEach(g => {
      html += `
        <div>
          <a href="game.html?gamePk=${g.gamePk}">
            ${g.away} ${g.awayScore}, ${g.home} ${g.homeScore}
          </a>
          <span class="state">${g.state}</span>
        </div>
      `;
    });

    html += `</div>`;

    document.getElementById("latest-games").innerHTML = html;

  } catch (err) {
    console.error("Latest games error:", err);
    document.getElementById("latest-games").innerHTML =
      "Failed to load games.";
  }
}

//
// -------------------------
// STANDINGS
// -------------------------
//
async function loadStandings() {
  try {
    const res = await fetch(
      "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"
    );

    const data = await res.json();
    const records = data.records || [];

    const divisionMap = {
      "American League East": "AL East",
      "American League Central": "AL Central",
      "American League West": "AL West",
      "National League East": "NL East",
      "National League Central": "NL Central",
      "National League West": "NL West"
    };

    let html = "";

    records.forEach(group => {

      const rawName =
        group.division?.name ||
        group.league?.name ||
        "MLB";

      const divisionName = divisionMap[rawName] || rawName;

      html += `<h3>${divisionName}</h3>`;

      html += `
        <table>
          <tr>
            <th>Team</th>
            <th>W</th>
            <th>L</th>
            <th>GB</th>
            <th>Streak</th>
          </tr>
      `;

      group.teamRecords.forEach(team => {

        const teamId = team.team.id;
        const logo = `https://www.mlbstatic.com/team-logos/${teamId}.svg`;
        const streak = team.streak?.streakCode || "-";

        html += `
          <tr>
            <td>
              <div class="team-cell">
                <img src="${logo}">
                ${team.team.name}
              </div>
            </td>
            <td>${team.wins}</td>
            <td>${team.losses}</td>
            <td>${team.gamesBack || "-"}</td>
            <td>${streak}</td>
          </tr>
        `;
      });

      html += `</table>`;
    });

    document.getElementById("standings").innerHTML = html;

  } catch (err) {
    console.error("Standings error:", err);
    document.getElementById("standings").innerHTML =
      "Failed to load standings.";
  }
}

//
// INIT
//
loadLatestGames();
loadStandings();

</script>

</body>
</html>
